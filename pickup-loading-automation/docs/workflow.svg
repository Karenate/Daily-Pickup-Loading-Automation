<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360"><rect width="1180" height="360" fill="#f7fafc"/><text x="35" y="42" font-family="Arial" font-size="24" font-weight="bold" fill="#173b60">Daily Pickup Loading Import — Synthetic Workflow</text><text x="35" y="67" font-family="Arial" font-size="14" fill="#5b7188">Import only · no new-month setup · no data refresh</text><rect x="35" y="95" width="263" height="76" rx="9" fill="#dceaf8" stroke="#bdcddd"/><text x="48" y="121" font-family="Arial" font-size="15" font-weight="bold" fill="#234866">1. Select Import</text><text x="48" y="145" font-family="Arial" font-size="13" fill="#456075">Product A / B / C / All</text><rect x="325" y="95" width="263" height="76" rx="9" fill="#e4f2e8" stroke="#bdcddd"/><text x="338" y="121" font-family="Arial" font-size="15" font-weight="bold" fill="#234866">2. Read Records</text><text x="338" y="145" font-family="Arial" font-size="13" fill="#456075">Shipment ID / Date / Weight</text><rect x="615" y="95" width="263" height="76" rx="9" fill="#fff0d8" stroke="#bdcddd"/><text x="628" y="121" font-family="Arial" font-size="15" font-weight="bold" fill="#234866">3. Validate &amp; Group</text><text x="628" y="145" font-family="Arial" font-size="13" fill="#456075">Aggregate by product and date</text><rect x="905" y="95" width="263" height="76" rx="9" fill="#e9e5f5" stroke="#bdcddd"/><text x="918" y="121" font-family="Arial" font-size="15" font-weight="bold" fill="#234866">4. Match Dates</text><text x="918" y="145" font-family="Arial" font-size="13" fill="#456075">Existing daily report dates</text><rect x="35" y="208" width="263" height="76" rx="9" fill="#dceaf8" stroke="#bdcddd"/><text x="48" y="234" font-family="Arial" font-size="15" font-weight="bold" fill="#234866">5. Write Daily Results</text><text x="48" y="258" font-family="Arial" font-size="13" fill="#456075">Loads / IDs / Net weight</text><rect x="325" y="208" width="263" height="76" rx="9" fill="#e4f2e8" stroke="#bdcddd"/><text x="338" y="234" font-family="Arial" font-size="15" font-weight="bold" fill="#234866">6. Show Summary</text><text x="338" y="258" font-family="Arial" font-size="13" fill="#456075">Days / Loads / Total weight</text><rect x="615" y="208" width="263" height="76" rx="9" fill="#fff0d8" stroke="#bdcddd"/><text x="628" y="234" font-family="Arial" font-size="15" font-weight="bold" fill="#234866">Repeatable Import</text><text x="628" y="258" font-family="Arial" font-size="13" fill="#456075">Output columns only</text><rect x="905" y="208" width="263" height="76" rx="9" fill="#e9e5f5" stroke="#bdcddd"/><text x="918" y="234" font-family="Arial" font-size="15" font-weight="bold" fill="#234866">Synthetic Portfolio</text><text x="918" y="258" font-family="Arial" font-size="13" fill="#456075">No company-specific data</text><text x="35" y="336" font-family="Arial" font-size="12" fill="#65778a">All labels, layout and data are independently reconstructed for demonstration.</text></svg>